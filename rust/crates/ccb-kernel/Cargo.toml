[package]
name = "ccb-kernel"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "AGPL-3.0-only"
description = "Persistent CCB scheduling kernel"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono = { version = "0.4", default-features = false, features = ["std"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
subtle = "2"
toml = "1.1"
jsonschema = { version = "0.58.6", default-features = false }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Console", "Win32_System_Pipes", "Win32_Globalization", "Win32_System_Environment", "Win32_System_SystemInformation", "Win32_System_RemoteDesktop", "Win32_System_SystemServices"] }

[[bin]]
name = "ccb-native"
path = "src/bin/ccb-native.rs"
